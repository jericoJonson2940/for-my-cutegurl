<!DOCTYPE html>
<html lang="tl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f58ab5">
  <title>She’s the kind of girl who… 🌷</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="petals"></div>

  <main id="stage" aria-live="polite">
    <section id="intro" class="screen active">
      <div class="glow"></div>
      <div class="flower flower-a">🌸</div>
      <div class="flower flower-b">🌸</div>
      <div class="flower flower-c">🌸</div>
      <div class="flower flower-d">🌸</div>

      <div class="intro-copy">
        <p class="tiny">Para sa isang espesyal na babae…</p>
        <h1>She’s the kind of girl who…</h1>
        <p class="sub">May munting surprise ako para sa'yo. 💗</p>
      </div>

      <img class="octopus-intro" src="assets/octopus.png" alt="Pink octopus">
      <button id="startBtn" class="start-btn">Tap to open 💗</button>
      <p class="hint">I-tap para magsimula ang music at animation.</p>
    </section>

    <section id="slideshow" class="screen">
      <div class="ambient"></div>
      <div id="imageWrap" class="image-wrap">
        <img id="slideImage" src="" alt="">
      </div>
      <div class="shade"></div>
      <div class="message-card">
        <div id="eyebrow" class="eyebrow"></div>
        <div id="message" class="message"></div>
      </div>

      <div class="controls">
        <button id="pauseBtn" aria-label="Pause">Ⅱ</button>
        <div class="progress"><div id="progressBar"></div></div>
        <span id="timeLabel">0:00 / 4:14</span>
      </div>
    </section>
  </main>

  <audio id="music" preload="auto">
    <!-- Ilagay ang music file mo bilang "music.mp3" sa parehong folder. -->
    <source src="music.mp3" type="audio/mpeg">
  </audio>

  <script src="script.js"></script>
</body>
</html>
